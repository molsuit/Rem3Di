training_name: tmc_64_dim
run_group: transition_metal_complexes
dataloader:
  batch_sampling:
    kind: bucket_batch
    max_atoms_per_batch: 10500
    max_batch_size: null
    bucket_size: 512
  num_workers: 12
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
epochs: 30
learning_rate: 0.0003
weight_decay: 0.001
max_grad_norm: 1.0
noise_level: 0.3
total_steps: null
data:
  domain: transition_metal_complex
  components:
  - dataset: /dais/fs/scratch/wedigs/remedi/pretraining/tmqm
  validation:
    kind: molecule_fraction
    fraction: 0.2
    seed: 0
  deduplicate_across_components: nonisomeric_smiles
model_config_path: /path/to/3DMolecularDescriptors/training_runs/example_dir/architecture_config.yaml
output_base: /path/to/training_runs
training_directory: null
wandb_active: true
vicreg:
  enabled: true
  variance_weight: 25.0
  covariance_weight: 1.0
  target_std: 1.0
compile:
  enabled: false
