# Workspace root only: members and the shared tool configuration (ruff, ty,
# pytest). The packages live under packages/ (see BENCHMARK_DATA_FORMAT.md
# §13); the benchmark preparers under preparers/. `uv sync --all-packages`
# installs every member into the shared venv.
[tool.uv.workspace]
members = [
    "packages/remedi-data",
    "packages/remedi-eval",
    "packages/remedi",
    "preparers/tdc",
    "preparers/moleculenet",
    "preparers/polaris",
    "preparers/chiralcat",
    "preparers/qm9or",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
# First-party detection for import sorting: the packages are not at the root.
src = [".", "packages/*"]
# The root has no [project], so requires-python cannot supply these.
target-version = "py312"
# Vulture whitelists are name lists, not importable code.
extend-exclude = ["tools/vulture/*whitelist*.py"]
lint.select = ["I", "UP", "F", "E", "W", "C90", "B", "A", "RUF"]
# UP042 (str + Enum -> StrEnum) changes str(member), and these enums are stored in
# zarr configs and yaml; switch deliberately, not as a lint fix.
lint.ignore = ["E501", "B008", "UP042"]

# Tests live next to their package (packages/<name>/tests); tests/integration
# holds the workspace-level ones (scripts/, configs/, package layout).
# importlib mode lets the per-package directories share module and conftest
# names. Each preparer runs its own suite from its own directory:
# `cd preparers/<name> && uv run --no-sync pytest`.
[tool.pytest.ini_options]
testpaths = [
    "packages/remedi-data/tests",
    "packages/remedi-eval/tests",
    "packages/remedi/tests",
    "tests/integration",
]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "pytest-cov",
    "ty>=0.0.32",
    "ruff",
    "vulture>=2.16",
]

[tool.ty.src]
exclude = ["tools/vulture/*whitelist*.py"]

[tool.ty.environment]
python-version = "3.12"
# preparers/chiralcat/tests before ".", so its `import conftest` does not resolve to the root conftest.
root = ["packages/remedi-data", "packages/remedi-eval", "packages/remedi", "preparers/chiralcat/tests", "."]

# Dead-code analysis, run by pre-commit through tools/vulture/run_vulture.py,
# which first regenerates the pydantic-field / enum-member whitelist.
# whitelist_reviewed.py lists everything kept on purpose, each with its reason.
[tool.vulture]
paths = [
    "packages",
    "preparers",
    "scripts",
    "tests",
    "tools/vulture/generated_whitelist.py",
    "tools/vulture/whitelist_reviewed.py",
]
exclude = ["preparers/qm9or/generators/"]
ignore_decorators = [
    "@model_validator",
    "@field_validator",
    "@computed_field",
    "@field_serializer",
    "@model_serializer",
    "@register_plotter",
    "@pytest.fixture",
    "@property",
    "@cached_property",
]
min_confidence = 60
