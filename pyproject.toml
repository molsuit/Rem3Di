# Workspace root only: members and the shared tool configuration (ruff, ty,
# pytest). The packages live under packages/ (see BENCHMARK_DATA_FORMAT.md
# §13); the benchmark preparers under preparers/. `uv sync --all-packages`
# installs every member into the shared venv.
[tool.uv.workspace]
members = [
    "packages/remedi-data",
    "packages/remedi",
    "preparers/tdc",
    "preparers/moleculenet",
    "preparers/polaris",
    "preparers/chiralcat",
    "preparers/qm9or",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
# First-party detection for import sorting: the packages are not at the root.
src = [".", "packages/*"]
# The root has no [project], so requires-python cannot supply these.
target-version = "py312"
lint.select = ["I", "UP", "F", "E", "W", "C90", "B", "A", "RUF"]
lint.ignore = ["E501", "B008"]

# Each preparer runs its own suite from its own directory (their conftest
# modules share a name): `uv run --no-sync pytest preparers/<name>`.
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "pytest-cov",
    "ty>=0.0.32",
    "ruff"
]

[tool.ty.environment]
python-version = "3.12"
root = ["packages/remedi-data", "packages/remedi", ".", "preparers/chiralcat/tests"]
