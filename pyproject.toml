[project]
name = "remedi"
version = "0.1.1"
description = "Smooth, chiral 3D molecular descriptors from atomistic foundation models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "molecular-descriptors",
    "cheminformatics",
    "machine-learned-interatomic-potentials",
    "mace",
    "equivariant",
    "chirality",
]
authors = [
    { name = "The Rem3Di Authors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core install is intentionally torch-free and lightweight. The PyTorch /
# MACE stack lives in the `cpu` and `cuda` extras so users install the build
# matching their platform (see the docs). `import remedi` works without them.
dependencies = [
    "ase>=3.24.0",
    "rdkit>=2024.9.4",
    "pydantic",
    "pydantic_yaml",
    "zarr>=3.2",
    "wandb",
    "umap-learn",
    "pymatgen>=2026.3.23",
    "datashader>=0.19.0",
    "chemiscope>=1.0.3",
    "PyTDC>=0.3.6",
    # Every bundle and dataset table is a parquet; pandas is already pulled
    # transitively, but the parquet engine is not.
    "pyarrow",
]

# ``polaris-lib`` is intentionally NOT listed here: it pins ``zarr<3`` and so
# cannot share a venv with this project (which requires ``zarr>=3.2`` for the
# MoleculeDataset store). Polaris datasets are dumped out-of-venv by
# ``preparers/polaris/dump_polaris.py`` (PEP 723 inline deps) and turned into
# bundles by the ``remedi-prepare-polaris`` workspace member.

[project.urls]
Homepage = "https://molsuit.github.io/Rem3Di/"
Documentation = "https://molsuit.github.io/Rem3Di/"
Repository = "https://github.com/molsuit/Rem3Di"
Paper = "https://openreview.net/forum?id=jOmZsvXoK5"

[project.optional-dependencies]
# PyTorch + MACE stack. `cpu` is enough to compute descriptors on CPU; `cuda`
# adds GPU accelerators. For a specific CUDA build of torch, install it from the
# PyTorch index yourself before/with the extra (PyPI ships the default build).
cpu = [
    "torch>=2.5.1",
    "mace-torch>=0.3.16",
    "torch-sim-atomistic",
]
cuda = [
    "remedi[cpu]",
    "cuequivariance-torch==0.9.1",
    "cuequivariance==0.9.1",
    "cuequivariance-ops-torch-cu12==0.9.1",
    # torch's cu126 wheels need libcusparseLt.so.0 at `import torch`.
    "nvidia-cusparselt-cu12",
    "nvmolkit>=0.5.0",
]
eval = [
    "lightgbm>=4.6.0",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "bblean>=0.10.3",
    "molfeat"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi"]

[tool.ruff]
# The QM9-OR split generators are the original author scripts, kept verbatim as
# a reference for how qm9or_splits.csv was produced; they import another package.
extend-exclude = ["preparers/qm9or/generators"]
lint.select = ["I", "UP", "F", "E", "W", "C90", "B", "A", "RUF"]
lint.ignore = ["E501", "B008"]

# Each preparer runs its own suite from its own directory (their conftest
# modules share a name): `uv run --no-sync pytest preparers/<name>`.
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "pytest-cov",
    "ty>=0.0.32",
    "ruff"
]
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# The benchmark preparers are workspace members with their own dependencies;
# `uv sync --all-packages` installs them into the shared venv.
[tool.uv.workspace]
members = [
    "preparers/tdc",
    "preparers/moleculenet",
    "preparers/polaris",
    "preparers/chiralcat",
    "preparers/qm9or",
]

# Local-dev only (uv): these are stripped from the built package's metadata.
[tool.uv.sources]
torch-sim-atomistic = { git = "https://github.com/TorchSim/torch-sim.git", branch = "main"}
torch = { index = "pytorch-cu126" }

[tool.ty.environment]
root = ["./remedi"]
