[project]
name = "chiralcat-dataset"
version = "0.1.0"
description = "Curation pipeline for the ChiralCat 3D chirality-classification dataset"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "rdkit>=2023.3",
    "scipy>=1.11",
]

[project.scripts]
build-chiralcat-dataset = "chiralcat_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chiralcat_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.run]
source = ["chiralcat_dataset"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# RDKit raises a bare exception from SanitizeMol for the organometallics and
# other exotic species in this dataset. Those failures are expected and the
# pipeline deliberately carries the unsanitised molecule on to the next step, so
# a guarded `try/except: pass` around sanitisation is the intended pattern here,
# not an oversight. Each occurrence carries a comment saying why.
ignore = ["S110", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test
