[project]
name = "remedi-prepare-polaris"
version = "0.1.0"
description = "Polaris hub parquet dumps -> one bundle per dataset"
requires-python = ">=3.12"
dependencies = [
    "remedi",
    "pandas",
    "pyarrow",
    "pydantic",
    "pyyaml",
]

[project.scripts]
prepare-polaris = "remedi_prepare_polaris.prepare:main"

[tool.uv.sources]
remedi = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi_prepare_polaris"]
