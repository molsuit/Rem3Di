[project]
name = "remedi-prepare-polaris"
version = "0.1.0"
description = "Polaris hub parquet dumps -> one bundle per dataset"
requires-python = ">=3.12"
dependencies = [
    "remedi-data",
    "numpy",
    "pandas",
    "pydantic",
    "rdkit>=2024.9.4",
]

[project.scripts]
prepare-polaris = "remedi_prepare_polaris.prepare:main"

[tool.uv.sources]
remedi-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi_prepare_polaris"]

# dump_polaris.py runs in its own PEP 723 environment (polaris-lib pins zarr<3).
[tool.deptry]
extend_exclude = ["dump_polaris\\.py"]
