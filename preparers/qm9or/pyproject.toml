[project]
name = "remedi-prepare-qm9or"
version = "0.1.0"
description = "Zenodo QM9-OR (record 13380412) -> the frozen QM9-OR molecule table and DFT frames"
requires-python = ">=3.12"
dependencies = [
    "ase",
    "numpy",
    "pandas",
    "pydantic",
    # The isomeric_smiles column is pinned by sha256; RDKit 2026.03.5, 2026.03.6
    # and 2026.09.2 all reproduce it (2026-11-17). Another canonicaliser can
    # change the strings (the preparer reports that case separately), so the
    # version is exact; it also holds the workspace's RDKit, which canonicalises
    # every other bundle's SMILES, at the version of the 2026-11-16 lock.
    "rdkit==2026.3.6",
]

[project.scripts]
prepare-qm9or = "remedi_prepare_qm9or.prepare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi_prepare_qm9or"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Importable before the package is installed as a workspace member.
pythonpath = ["."]
