[project]
name = "remedi-prepare-moleculenet"
version = "0.1.0"
description = "MoleculeNet (DeepChem S3 release) -> one bundle per dataset"
requires-python = ">=3.12"
dependencies = [
    "remedi-data",
    "pandas",
    "pydantic",
    "pyyaml",
]

[project.scripts]
prepare-moleculenet = "remedi_prepare_moleculenet.prepare:main"

[tool.uv.sources]
remedi-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi_prepare_moleculenet"]
