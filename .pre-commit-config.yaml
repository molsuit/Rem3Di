repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
        args: ['--maxkb=1000']
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.8
  hooks:
  - id: ruff
    args: ["--fix"]
  - id: ruff-format
# Dead code: regenerates the pydantic/enum whitelist, then runs vulture with the
# [tool.vulture] settings in pyproject.toml. Needs the synced workspace venv.
- repo: local
  hooks:
  - id: vulture
    name: vulture (dead code)
    entry: uv run --no-sync python tools/vulture/run_vulture.py
    language: system
    types: [python]
    pass_filenames: false
