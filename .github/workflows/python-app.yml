# Lint, dead-code check and tests for the uv workspace (remedi-data, remedi-eval, remedi and the
# benchmark preparers), installed from the committed uv.lock.

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the workspace (CPU)
        run: uv sync --locked --all-packages --extra cpu
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Dead code
        run: uv run --no-sync python tools/vulture/run_vulture.py
      - name: Workspace tests
        run: uv run --no-sync pytest -q
      - name: Preparer tests
        # Each preparer runs its own suite from its own directory (their
        # conftest modules share a name).
        run: |
          for preparer in tdc moleculenet polaris chiralcat qm9or; do
            (cd "preparers/$preparer" && uv run --no-sync pytest -q)
          done
