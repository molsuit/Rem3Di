[project]
name = "remedi-eval"
version = "0.1.1"
description = "The Rem3Di benchmark evaluation: descriptor probes, learners, scoring and the eval framework"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "The Rem3Di Authors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Never imports remedi: trained encoders enter as precomputed embeddings
# (BENCHMARK_DATA_FORMAT.md §7.5). torch is required for the MLP learner.
dependencies = [
    "remedi-data",
    "ase>=3.24.0",
    # BitBIRCH clustering, UMAP and datashader plots in dataset_analysis/.
    "bblean>=0.10.3",
    "datashader>=0.19.0",
    "umap-learn",
    "lightgbm>=4.6.0",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "pydantic",
    "rdkit>=2024.9.4",
    "scikit-learn",
    "scipy",
    "torch>=2.15.0",
]

[project.optional-dependencies]
# The tmQM chemistry (pymatgen) and the chemiscope exports of
# framework/tasks/descriptor_analysis; the other descriptor analyses run without.
descriptor-analysis = [
    "pymatgen>=2026.3.23",
    "chemiscope>=1.0.3",
]
# GPU nearest-neighbour Tanimoto in dataset_analysis/comparison.py (backend "nvmolkit").
cuda = [
    "nvmolkit>=0.7.0",
    # nvmolkit declares cuda-runtime-cu12 >= 12.0 but calls cudaStreamGetDevice (CUDA 12.8+).
    "nvidia-cuda-runtime-cu12>=12.8",
]

[project.urls]
Homepage = "https://molsuit.github.io/Rem3Di/"
Repository = "https://github.com/molsuit/Rem3Di"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi_eval"]

# Declared and imported dependencies agree (tests/integration/test_declared_dependencies.py).
[tool.deptry.per_rule_ignores]
# The CUDA runtime pin of the cuda extra is loaded by nvmolkit, never imported.
DEP002 = ["nvidia-cuda-runtime-cu12"]

# Local-dev only (uv): stripped from the built package's metadata.
[tool.uv.sources]
remedi-data = { workspace = true }
torch = { index = "pytorch-cu132" }
