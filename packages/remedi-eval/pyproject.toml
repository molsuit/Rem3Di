[project]
name = "remedi-eval"
version = "0.1.1"
description = "The Rem3Di benchmark evaluation: descriptor probes, learners, scoring and the eval framework"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "The Rem3Di Authors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Never imports remedi: trained encoders enter as precomputed embeddings
# (BENCHMARK_DATA_FORMAT.md §7.5). torch is required for the MLP learner.
dependencies = [
    "remedi-data",
    "lightgbm>=4.6.0",
    "matplotlib",
    "molfeat",
    "numpy",
    "pandas",
    "pydantic",
    "pydantic_yaml",
    "scikit-learn",
    "scipy",
    "torch>=2.5.1",
]

[project.urls]
Homepage = "https://molsuit.github.io/Rem3Di/"
Repository = "https://github.com/molsuit/Rem3Di"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi_eval"]

# Local-dev only (uv): stripped from the built package's metadata.
[tool.uv.sources]
remedi-data = { workspace = true }
torch = { index = "pytorch-cu126" }
