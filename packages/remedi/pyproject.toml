[project]
name = "remedi"
version = "0.1.1"
description = "Smooth, chiral 3D molecular descriptors from atomistic foundation models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "molecular-descriptors",
    "cheminformatics",
    "machine-learned-interatomic-potentials",
    "mace",
    "equivariant",
    "chirality",
]
authors = [
    { name = "The Rem3Di Authors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The MACE stack is part of the base install: the model, its configuration and
# the embedding writer all build on it. For a specific CUDA build of torch,
# install it from the PyTorch index yourself (PyPI ships the default build).
dependencies = [
    "remedi-data",
    "remedi-eval",
    "ase>=3.24.0",
    "e3nn",
    # The fork's POLAR branch: MACE-POLAR with in-tree electrostatics and modules
    # prepared for torch.compile (the compiled featurizer builds on them).
    "mace-torch",
    "matplotlib",
    "numpy",
    "polars",
    "pydantic",
    "scikit-learn",
    "torch>=2.15.0",
]

# ``polaris-lib`` is intentionally NOT listed here: it is only needed to download
# the Polaris datasets, so ``preparers/polaris/dump_polaris.py`` runs it in its own
# PEP 723 environment, and the ``remedi-prepare-polaris`` workspace member turns the
# dumped parquets into bundles.

[project.urls]
Homepage = "https://molsuit.github.io/Rem3Di/"
Documentation = "https://molsuit.github.io/Rem3Di/"
Repository = "https://github.com/molsuit/Rem3Di"
Paper = "https://openreview.net/forum?id=jOmZsvXoK5"

[project.optional-dependencies]
# GPU kernels of the MACE layers (MaceConfig.enable_cueq), loaded by mace-torch.
# Within the mace-torch fork's cueq ranges, frontend and ops on the same minor
# release (the cu13 ops start at 0.7.0). Ops releases from 0.11 on link
# a newer cuBLAS than they declare and fail to import.
cuda = [
    "cuequivariance-torch>=0.7.0,<0.11",
    "cuequivariance>=0.7.0,<0.11",
    "cuequivariance-ops-torch-cu13>=0.7.0,<0.11",
]
# Weights & Biases logging of the training runs (TrainingRunConfig.wandb_active).
telemetry = [
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi"]

# Declared and imported dependencies agree (tests/integration/test_declared_dependencies.py).
[tool.deptry.per_rule_ignores]
# The cuda extra's kernels are loaded by mace-torch, never imported here.
DEP002 = ["cuequivariance-torch", "cuequivariance", "cuequivariance-ops-torch-cu13"]

# Local-dev only (uv): these are stripped from the built package's metadata.
[tool.uv.sources]
remedi-data = { workspace = true }
remedi-eval = { workspace = true }
mace-torch = { git = "https://github.com/steffen-wedig/mace.git", rev = "3b7adce92a8499efd50b3cf578031f73d3fecc3c" }
torch = { index = "pytorch-cu132" }
