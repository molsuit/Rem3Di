[project]
name = "remedi-data"
version = "0.1.1"
description = "The Rem3Di bundle and dataset format, chemistry, dataset build and task runner (torch-free)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "The Rem3Di Authors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# Torch-free on purpose: the preparers and remedi-eval install this without
# the model stack (BENCHMARK_DATA_FORMAT.md §3).
dependencies = [
    "ase>=3.24.0",
    # The frames of a dataset (structures.atp); only remedi_data.dataset.structure_file
    # imports it. Pinned exactly: the project and its file format are young.
    "atompack-db==0.4.1",
    "rdkit>=2024.9.4",
    "numpy",
    "pandas",
    # Preferred for new dataframe code.
    "polars",
    # Every bundle and dataset table is a parquet: pandas' parquet engine, and the
    # writer of a dataset table's row groups.
    "pyarrow",
    "pydantic",
    "pyyaml",
]

[project.urls]
Homepage = "https://molsuit.github.io/Rem3Di/"
Repository = "https://github.com/molsuit/Rem3Di"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remedi_data"]
