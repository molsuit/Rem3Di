    path: /path/to/datasets/benchmarks/CYP2C9_Veith
  - name: CYP2D6_Substrate_CarbonMangels
    role: eval
    path: /path/to/datasets/benchmarks/CYP2D6_Substrate_CarbonMangels
  - name: CYP2D6_Veith
    role: eval
    path: /path/to/datasets/benchmarks/CYP2D6_Veith
  - name: CYP3A4_Substrate_CarbonMangels
    role: eval
    path: /path/to/datasets/benchmarks/CYP3A4_Substrate_CarbonMangels
  - name: CYP3A4_Veith
    role: eval
    path: /path/to/datasets/benchmarks/CYP3A4_Veith
  - name: DILI
    role: eval
    path: /path/to/datasets/benchmarks/DILI
  - name: esol
