bitbirch:
  enabled: true
  fingerprint_kind: ecfp4
  n_features: 2048
  threshold: 0.65               # ignored when auto_threshold is true
  auto_threshold: true
  auto_threshold_factor: 3.0
  branching_factor: 50
  merge_criterion: diameter
  max_molecules: null
  umap:
    enabled: true
    sample_size: 200000
    n_neighbors: 30
    min_dist: 0.1
    metric: jaccard
    top_clusters_colored: 30
    plot_size: 1600

nn_tanimoto:
  enabled: true
  fingerprint_kind: ecfp4
  n_features: 2048
  chunk_size: 1024
  backend: cpu
  histogram_bins: 50

scaffold_overlap:
  enabled: true
  include_generic: true
  n_rdkit_workers: 32
