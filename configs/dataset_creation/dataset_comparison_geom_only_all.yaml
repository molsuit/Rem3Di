# GEOM-drugs only as pretrain vs EVERY zarr currently under
# /path/to/datasets/benchmarks (37 datasets). Sibling of
# dataset_comparison_full_all.yaml that drops pcqm so we can read out
# how much of the benchmark space GEOM alone covers.
#
# Run with:
#   sbatch scripts/dataset_creation/run_dataset_comparison_geom_only_all.sbatch

output_dir: /path/to/datasets/comparisons/geom_vs_benchmarks_all

random_seed: 1234
rdkit_n_workers: 32
top_clusters_plotted: 40

datasets:
  - name: geom_drugs
    role: pretrain
    path: /path/to/datasets/geom_drugs
  - name: AMES
    role: eval
    path: /path/to/datasets/benchmarks/AMES
  - name: bace
    role: eval
    path: /path/to/datasets/benchmarks/bace
  - name: bace_pic50
    role: eval
    path: /path/to/datasets/benchmarks/bace_pic50
  - name: BBB_Martins
    role: eval
    path: /path/to/datasets/benchmarks/BBB_Martins
  - name: bbbp
    role: eval
    path: /path/to/datasets/benchmarks/bbbp
  - name: Bioavailability_Ma
    role: eval
    path: /path/to/datasets/benchmarks/Bioavailability_Ma
  - name: Caco2_Wang
    role: eval
    path: /path/to/datasets/benchmarks/Caco2_Wang
  - name: Clearance_Hepatocyte_AZ
    role: eval
    path: /path/to/datasets/benchmarks/Clearance_Hepatocyte_AZ
  - name: Clearance_Microsome_AZ
    role: eval
    path: /path/to/datasets/benchmarks/Clearance_Microsome_AZ
  - name: clintox
    role: eval
    path: /path/to/datasets/benchmarks/clintox
  - name: CYP2C9_Substrate_CarbonMangels
    role: eval
    path: /path/to/datasets/benchmarks/CYP2C9_Substrate_CarbonMangels
  - name: CYP2C9_Veith
