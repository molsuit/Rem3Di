  - name: hERG
    role: eval
    path: /path/to/datasets/benchmarks/hERG
  - name: HIA_Hou
    role: eval
    path: /path/to/datasets/benchmarks/HIA_Hou
  - name: hiv
    role: eval
    path: /path/to/datasets/benchmarks/hiv
  - name: LD50_Zhu
    role: eval
    path: /path/to/datasets/benchmarks/LD50_Zhu
  - name: lipophilicity
    role: eval
    path: /path/to/datasets/benchmarks/lipophilicity
  - name: Lipophilicity_AstraZeneca
