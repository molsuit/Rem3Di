# GEOM-drugs only as pretrain vs the benchmark eval panel. Sibling of
# dataset_comparison_full.yaml that drops pcqm so we can read out how much
# of the benchmark space GEOM alone covers (informs whether GEOM is a
# sufficient pretrain corpus on its own, vs needing pcqm to fill gaps).
#
# Run with:
#   sbatch scripts/dataset_creation/run_dataset_comparison_geom_only.sbatch

output_dir: /path/to/datasets/comparisons/geom_vs_benchmarks

random_seed: 1234
rdkit_n_workers: 32
top_clusters_plotted: 30

datasets:
  - name: geom_drugs
    role: pretrain
    path: /path/to/datasets/geom_drugs
  - name: bace
    role: eval
    path: /path/to/datasets/benchmarks/bace
  - name: bbbp
    role: eval
    path: /path/to/datasets/benchmarks/bbbp
  - name: esol
    role: eval
    path: /path/to/datasets/benchmarks/esol
  - name: freesolv
    role: eval
    path: /path/to/datasets/benchmarks/freesolv

bitbirch:
  enabled: true
  fingerprint_kind: ecfp4
  n_features: 2048
  threshold: 0.65               # ignored when auto_threshold is true
  auto_threshold: true
  auto_threshold_factor: 3.0
  branching_factor: 50
  merge_criterion: diameter
  max_molecules: null
  umap:
    enabled: true
    sample_size: 100000
    n_neighbors: 30
    min_dist: 0.1
    metric: jaccard
    top_clusters_colored: 20
    plot_size: 1600

nn_tanimoto:
  enabled: true
  fingerprint_kind: ecfp4
  n_features: 2048
  chunk_size: 1024
  backend: cpu
  histogram_bins: 50

scaffold_overlap:
  enabled: true
  include_generic: true
  n_rdkit_workers: 32
