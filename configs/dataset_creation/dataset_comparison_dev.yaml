# Dev config for `DatasetComparison`. Compares two small benchmark zarrs so
# the full pipeline (BitBIRCH, NN Tanimoto, scaffold overlap) finishes in
# seconds instead of the hours needed for a full pcqm4m vs benchmarks
# comparison. The role labels are nominal here -- it's two benchmarks role-
# tagged so the pretrain/eval code paths exercise. For the real comparison,
# point one entry at the pcqm4m zarr with role=pretrain and the rest at the
# benchmark zarrs with role=eval.

output_dir: /path/to/datasets/comparisons/dev_freesolv_vs_bace

random_seed: 1234
rdkit_n_workers: 8
top_clusters_plotted: 20

datasets:
  - name: freesolv
    role: pretrain          # nominal -- stand-in for the real pretraining set
    path: /path/to/datasets/benchmarks/freesolv
  - name: bace
    role: eval
    path: /path/to/datasets/benchmarks/bace

bitbirch:
  enabled: true
  fingerprint_kind: ecfp4
  n_features: 2048
  threshold: 0.65
  branching_factor: 50
  merge_criterion: diameter
  max_molecules: null
  umap:
    enabled: true
    sample_size: null
    n_neighbors: 30
    min_dist: 0.1
    metric: jaccard
    top_clusters_colored: 10
    plot_size: 1200

nn_tanimoto:
  enabled: true
  fingerprint_kind: ecfp4
  n_features: 2048
  chunk_size: 256
  backend: cpu
  histogram_bins: 40

scaffold_overlap:
  enabled: true
  include_generic: true
  n_rdkit_workers: 4
