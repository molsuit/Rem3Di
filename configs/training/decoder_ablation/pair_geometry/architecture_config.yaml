# Decoder as in drug_like_small: pair geometry biases its attention.
decoder_config:
  N_layers: 4
  embedding_dimension: 256
  attention_layer_config:
    dim_feedforward: 1024
    dropout: 0.1
    update_pair: true
    num_heads: 8
embedding_preprocess_config:
  chiral_embedding_dimension: 0
  gated: true
  invariant_normalization_config:
    kind: precomputed_normalization
  mace_layer_indices:
  - 1
  mace_per_layer_irreps:
  - 512x0e+512x1o
  - 512x0e+512x1o
  pseudoscalar_dimension: 0
  pseudoscalars: false
encoder_config:
  N_layers: 4
  embedding_dimension: 256
  attention_layer_config:
    dim_feedforward: 1024
    dropout: 0.1
    update_pair: true
    num_heads: 8
global_aggregator_config:
  aggregator_config:
    kind: attention
    attn_dropout: 0.1
    head_dim: null
    num_heads: 8
  global_molecular_descriptor_dropout: 0.0
  output_dim: 64
kind: encoder_decoder
mace_config:
  compute_forces: false
  compute_stress: false
  device: cuda
  dtype: float32
  enable_cueq: true
  model_path:
    /dais/u/wedigs/graph_electrostatics/MACE-POLAR-1-M.model
positional_encoding_config:
  # Gaussians every 0.25 A up to 16 A: resolves bonded distances; pairs
  # beyond the cutoff get all-zero features.
  N_radial_basis_functions: 64
  basis_function_config:
    kind: gaussian
  d_projection: 64
  distance_cutoff: 16.0
