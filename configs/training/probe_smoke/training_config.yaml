compile:
  dynamo_cache_size_limit: 16
  enabled: false
  pad_multiple: 1
dataloader:
  batch_sampling:
    bucket_size: 512
    kind: bucket_batch
    max_atoms_per_batch: 5250
    max_batch_size: null
  num_workers: 12
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
data:
  domain: drug_like
  components:
  - dataset: /dais/fs/scratch/wedigs/remedi/pretraining/pcqm4mv2
    selection: random_100k
  validation:
    kind: molecule_fraction
    fraction: 0.02
    seed: 0
  deduplicate_across_components: nonisomeric_smiles
epochs: 1
learning_rate: 0.0003
max_grad_norm: 1.0
model_config_path: /path/to/3DMolecularDescriptors/configs/training/probe_smoke/architecture_config.yaml
noise_level: 0.3
output_base: /path/to/training_runs/probe_smoke
run_group: probe_smoke
training_name: probe_smoke
training_directory: null
wandb_active: true
weight_decay: 0.001
vicreg:
  covariance_weight: 1.0
  enabled: false
  target_std: 1.0
  variance_weight: 25.0
probe:
  enabled: true
  every_n_steps: 100
  n_probe_molecules: 1024
  ridge_alpha: 1.0
  val_fraction: 0.3
  properties: null
  report_count_accuracy: false
  seed: 0
