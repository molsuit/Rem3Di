# Benchmark eval config template.
#
# Copy to e.g. configs/eval/benchmark_eval_local.yaml and adjust the
# placeholder paths, then:
#
#   uv run python scripts/evaluation/run_benchmark_eval.py \
#       --config configs/eval/benchmark_eval_local.yaml
#
# The runner walks `eval_root` via discover_benchmark_zarrs (each prepared
# zarr carries a BenchmarkManifest sidecar) and evaluates the cross-product
# of `descriptors × learners` on every benchmark, scoring on the manifest's
# metric. Results go to `output_dir/results.csv` + `results.yaml`.

eval_root: <PLACEHOLDER>/datasets/benchmarks
output_dir: evaluation_results/benchmark_eval

# Optional override (defaults to `output_dir / descriptor_cache`).
# descriptor_cache_dir: evaluation_results/descriptor_cache

seed: 0

descriptors:
  - descriptor_kind: ecfp
    name: ecfp4_2048
    fingerprint: ecfp
    length: 2048
  # - descriptor_kind: remedi
  #   name: remedi_geom350k
  #   model_dir: <PLACEHOLDER>/training_runs/geom_drugs_350k/...
  #   batch_size: 64
  #   device: cuda

learners:
  - learner_kind: linear
    ridge_alpha: 1.0
    logreg_C: 1.0
  - learner_kind: lightgbm
    n_estimators: 2000
    early_stopping_rounds: 50
  # MLP requires CUDA by default; set allow_cpu_mlp: true for a CPU diagnostic.
  # - learner_kind: mlp
  #   hidden_dims: [256, 128]
  #   dropout: 0.2
  #   max_epochs: 100
  #   patience: 10
  #   device: cuda
