# Baseline: the same checkpoint's encoder input (MACE-POLAR-1-M layer-1
# invariants, 512-d) averaged over each molecule's atoms. ECFP-2048 is scored
# in the same panel as a second baseline.
# TDC ADMET (22) and MoleculeNet/Polaris (15) in one panel with linear,
# LightGBM and MLP learners, on five train/valid splits (split__seed1..5,
# fixed test fold) with learner seeds 0..4. One GPU job (embeds every
# dataset, then evaluates):
#   sbatch --time=02:30:00 scripts/evaluation/embed_and_evaluate.slurm \
#       configs/evaluation/drug_like_small/mace_polar_layer1_mean.yaml
embedding:
  kind: mace_mean
  name: mace_polar_layer1_mean
  model_dir: /dais/fs/scratch/wedigs/remedi/training_runs/drug_like_small/0-2026_11_17_20_32_49-drug_like_small_baseline
manifest:
  model:
    kind: precomputed
    name: mace_polar_layer1_mean
    embeddings_root: /dais/fs/scratch/wedigs/remedi/eval_runs/embeddings
  output_root: /dais/fs/scratch/wedigs/remedi/eval_runs/drug_like_small/mace_polar_layer1_mean
  tasks:
  - kind: benchmark_panel
    eval_root: benchmark_data/datasets
    dataset_ids:
    - Caco2_Wang
    - HIA_Hou
    - Pgp_Broccatelli
    - Bioavailability_Ma
    - Lipophilicity_AstraZeneca
    - Solubility_AqSolDB
    - BBB_Martins
    - PPBR_AZ
    - VDss_Lombardo
    - CYP2C9_Veith
    - CYP2D6_Veith
    - CYP3A4_Veith
    - CYP2C9_Substrate_CarbonMangels
    - CYP2D6_Substrate_CarbonMangels
    - CYP3A4_Substrate_CarbonMangels
    - Half_Life_Obach
    - Clearance_Hepatocyte_AZ
    - Clearance_Microsome_AZ
    - LD50_Zhu
    - hERG
    - AMES
    - DILI
    - esol
    - freesolv
    - lipophilicity
    - bace_pic50
    - bace
    - bbbp
    - hiv
    - clintox
    - sider
    - tox21
    - polaris_antiviral_admet
    - polaris_antiviral_potency
    - polaris_adme_fang
    - polaris_pkis2_subset
    - polaris_pkis2_subset_cls
    learners:
    - kind: linear
      name: linear
    - kind: lightgbm
      name: lightgbm
    - kind: mlp
      name: mlp
    split_columns:
    - split__seed1
    - split__seed2
    - split__seed3
    - split__seed4
    - split__seed5
    baseline_descriptors:
    - kind: ecfp
      name: ecfp_2048
      fingerprint_size: 2048
  seed: 0
