kind: regression
embedding_preprocess_config:
  input_irreps: 128x0e+128x1o+128x0e
  pseudoscalar_dimension: 128
  chiral_embedding_dimension: 128
  pseudoscalars: true
encoder_config:
  N_layers: 1
  attention_layer_config:
    dim_feedforward: 256
    dropout: 0.3
    embedding_dim: 384
    num_heads: 8
positional_encoding_config:
  N_radial_basis_functions: 16
  d_projection: 64
  distance_cutoff: 32.0
global_aggregator_config:
  aggregator_type_config:
    aggregator_type: mean
  input_dim: 384
  output_dim: 384
regression_head_config:
- activation_fn: SiLU
  head_type: residual
  hidden_dimensions:
  - 128
  input_dimensions: 386
  task_name: cmrt
